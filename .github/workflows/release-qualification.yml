name: Release qualification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: pulse_test
          MYSQL_USER: pulse
          MYSQL_PASSWORD: qualification
          MYSQL_ROOT_PASSWORD: qualification-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u pulse --password=qualification"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: cms
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pulse_test
      DB_USERNAME: pulse
      DB_PASSWORD: qualification
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: npm ci
      - run: npm run build
      - name: Verify frontend manifest exists before rendered-view tests
        run: test -s public/build/manifest.json
      - run: php artisan test
      - name: Verify canonical release SQL imports cleanly
        run: |
          sha256sum --check database/releases/pulse_cms_mysql.sql.sha256
          mysql -h 127.0.0.1 -u pulse --password=qualification -e 'DROP DATABASE pulse_test; CREATE DATABASE pulse_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h 127.0.0.1 -u pulse --password=qualification pulse_test < database/releases/pulse_cms_mysql.sql
          php artisan migrate:status
          php artisan migrate --force
